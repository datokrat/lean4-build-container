http_port 3128

# Logging ohne /dev/stdout (Permissions-Problem)
cache_log /var/log/squid/cache.log
access_log /var/log/squid/access.log squid

# Whitelist
acl allowed_domains dstdomain .lean-lang.org
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .api.anthropic.com
acl allowed_domains dstdomain .platform.claude.com
acl allowed_domains dstdomain .downloads.claude.ai
acl allowed_domains dstdomain .ports.ubuntu.com
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .storage.googleapis.com
acl allowed_domains dstdomain .files.pythonhosted.org
acl allowed_domains dstdomain .auth.openai.com
acl allowed_domains dstdomain .chatgpt.com
acl allowed_domains dstdomain .nodejs.org
acl allowed_domains dstdomain .deb.nodesource.com
acl allowed_domains dstdomain .registry.npmmirror.com
acl allowed_domains dstdomain .registry.npmjs.org
acl allowed_domains dstdomain .www.npmjs.com
acl allowed_domains dstdomain .open-vsx.org
acl allowed_domains dstdomain .openvsx.eclipsecontent.org
acl allowed_domains dstdomain .static.rust-lang.org
acl allowed_domains dstdomain .crates.io
acl allowed_domains dstdomain .pi.dev
acl allowed_domains dstdomain .nodejs.org
acl allowed_domains dstdomain .registry.npmjs.org
acl allowed_domains dstdomain .tailscale.com
acl allowed_domains dstdomain .lakecache.blob.core.windows.net
acl allowed_domains dstdomain .gitlab.opencode.de
acl allowed_domains dstdomain .www.w3.org
acl allowed_domains dstdomain .drops.dagstuhl.de
acl allowed_domains dstdomain .arxiv.org
acl allowed_domains dstdomain .www.rfc-editor.org
acl allowed_domains dstdomain .paulr.de
acl allowed_domains dstdomain .opam.ocaml.org
acl allowed_domains dstdomain .openrouter.ai
acl allowed_domains dstdomain .oaiusercontent.com
acl allowed_domains dstdomain .releases.openai.com
acl allowed_domains dstdomain .cdn.playwright.dev
# acl allowed_domains dstdomain .api.trycloudflare.com
acl allowed_domains dstdomain .serveo.net

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access allow allowed_domains
http_access deny all

# Cache-Verzeichnis
cache_dir ufs /var/spool/squid 100 16 256
